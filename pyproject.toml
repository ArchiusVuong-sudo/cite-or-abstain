[project]
name = "cite-or-abstain"
version = "0.1.0"
description = "Preference-tune a small open model to cite registry values from synthetic oncology notes or abstain"
authors = [{ name = "Khanh Vuong Tuan" }]
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.120",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "pydantic>=2.8",
  "rank-bm25==0.2.2",
  "claude-agent-sdk>=0.2.160",
  "torch==2.14.0",
  "transformers==5.17.0",
  "peft==0.21.0",
  "trl==1.13.0",
  "datasets==4.8.4",
  "accelerate>=1.0",
  "safetensors>=0.4",
  "sentencepiece>=0.2",
  "pyyaml>=6",
]

[project.optional-dependencies]
axolotl = ["axolotl==0.20.0", "bitsandbytes==0.50.2"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "playwright>=1.45"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["coa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long model or Axolotl runs (make test-slow)", "live: calls the real Claude login (LIVE=1)"]
addopts = "-m 'not slow and not live'"
